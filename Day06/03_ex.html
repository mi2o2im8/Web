<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>css ex</title>

        <style>

            #header{
                background-color: #cccccc;
                text-align: center;
                padding: 3em 0em;

                background-image: url('./image/dog.png');
                background-size: auto; /*기본값*/
                background-size: contain; /*영역안에 표시될 사이즈로 축소*/
                background-size: cover;
                color: white;
            }
            ul{
                list-style: none;
                border-top: 1px solid rgb(95, 124, 255);
                border-bottom: 1px solid rgb(95, 124, 255);
                padding: 10px 0;
                text-align: center;
            }

            ul li{
                display: inline;
                padding: 0 10px;
                letter-spacing: .25em;
            }

            ul li a{text-decoration: none; color: violet;}
            ul li a:hover{text-decoration: underline;}
        </style>
    </head>
    <body>
        <div id="header">
            <h1>HOME PAGE</h1>
            <p>This is my home page</p>
        </div>
        <ul>
            <li><a href="./index.html">HOME</a></li>
            <li><a href="./blog.html">BLOG</a></li>
            <li><a href="./about.html">ABOUT US</a></li>
            <li><a href="./contact.html">CONTACT</a></li>
        </ul>
    </body>
</html>
