<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>layout test</title>

        <style>
            #wrapper{
                width: 600px;
                border: 1px solid blueviolet;
                margin: auto; margin-right: auto;
            }

            #header{
                background-color: beige;
                width: 100%;
                height: 50px;
            }

            #nav{
                background-color: rgb(255, 168, 197);
                width: 30%;
                height: 150px;
                float: left;                 
            }

            #main{
                background-color: aquamarine;
                width: 70%;
                height: 150px;
                float: left;
            }

            #footer{
                background-color: rgb(48, 48, 48);
                color: white;
                width: 100%;
                height: 50px; 
                clear: both; /*both는 둘 다 적용하겠다. left, right를.*/
            }

            



        </style>
    </head>
    <body>
        
        <div id="wrapper">
            <div id="header">HEADER</div>
            <div id="nav">NAV MENY</div>
            <div id="main">CONTENT</div>
            <div id="footer">FOOTER</div>
        </div>




    </body>
</html>
