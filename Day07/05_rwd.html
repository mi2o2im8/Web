<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 웹 디자인</title>

    <style>
        *{padding: 0%px; margin: 0px;}

        #wrap{
            width: 90%;
            margin: 0%px auto;
            border: 4px solid violet;
        }

        #wrap div{
            display: inline-block;
            height: 100px;
        }

        #wrap div:first-child{ background-color: aqua; }
        #wrap div:nth-child(2){background-color: rgb(108, 91, 139);}
        #wrap div:nth-child(3){background-color: rgb(168, 158, 68);}
        #wrap div:nth-child(4){background-color: rgb(12, 175, 175);}
        #wrap div:last-child{background-color: yellow;}

        /* 5개의 영역을 브라우저의 너비에 따라 반응형으로 배치하기 */
        /* 작업은 모바일 우선으로.. 작은사이즈 부터 작성하는 것이 일반적임 */
        /* (1) 모바일 환경일때.. 최소너비 320px 이상 */
        @media all and (min-width:320px){
            #wrap div{ width: 100%;} /*한 줄에 하나씩*/
        }

        /* (2) 태블릿 환경일때..600px 이상일때 */
        @media all and (min-width:600px){
            #wrap div{width: 50%;}
            #wrap div:last-child{width: 100%;}
        }

        /* (3) 데스크탑 환경일때.. 800px 이상 */
        @media all and (min-width:800px){
            #wrap div{width: 20%;}
            #wrap div:last-child{width: 20%;}
        }

    </style>
</head>
<body>

    <div id="wrap">
        <div>aa</div>
        <div>bb</div>
        <div>cc</div>
        <div>dd</div>
        <div>ee</div>

    </div>
    
</body>
</html>
