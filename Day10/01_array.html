<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array JS의 배열</title>

    <!-- 내부 스크립트 작성 -->
    <script>
        //이 영역 안에서는 JS언어의 문법체계를 따름.

        //배열 Array - 여러개의 데이터를 하나의 변수로 관리하기 위한 문법(자료구조)
        //파이썬과는 달리 리스트, 튜플, 딕셔너리 등으로 구분되어 있지 않고 모두 배열로 관리됨.

        //JS에서 배열을 만드는 2가지 생성 방법 
        //1. 리터럴 배열 (literal array)
        var aaa= [10, 20, 30];
        // document는 글씨를 쓸 바디영역
        document.write(aaa + '<br>'); //배열의 요소값들을, 구분으로 문자열로 줌
        document.write(aaa[0] + '<br>');
        document.write(aaa[1] + '<br>');
        document.write(aaa[2] + '<br>');
        document.write(aaa[3] + '<br>'); //예외발생이 아니라..undefined로 출력

        document.write('<hr>');

        //요소들의 자료형이 달라도 됨.
        var bbb= [10, 'sam', true];
        document.write(bbb[0] + '<br>');
        document.write(bbb[1] + '<br>');
        document.write(bbb[2] + '<br>');

        // 배열의 요소개수를 확인할 수 있음.
        document.write('요소 개수: ' + bbb.length + '<br>'); //3개

        // 파이썬의 리스트처럼 새로운 요소를 추가할 수 있음. [재로운 인덱스 번호 사이의 요소는 자동 생성] (리스트와 딕셔너리 있다고 봐야함)
        bbb[5]= 100;
        document.write(bbb.length + '<br>'); //6개
        document.write(bbb[0]+'<br>');
        document.write(bbb[1]+'<br>');
        document.write(bbb[2]+'<br>');
        document.write(bbb[3]+'<br>'); //undefined
        document.write(bbb[4]+'<br>'); //undeifned
        document.write(bbb[5]+'<br>');
        document.write('<br>');


        // 요소의 값들을 반복문으로 접근하기...
        
        // 0부터 6보다 작을때까지..하나씩 증가
        for(var n=0; n<6; n++){
        // (var n)
            document.write(bbb[n] + '<br>'); //br 없을시 한줄로만 출력
        }
        document.write('<hr>');

        //2. Array 객체로 배열 생성
        var ccc= new Array(10,20,30);
        for(var n=0; n>ccc.length; n++){
            document.write(ccc[n]+'<br>');
        }
        document.write('<br>');

        // 대량의 데이터 요소를 순차적으로 접근할대 사용하는 for in 문법 (파이썬과 다르게 요소값이 아니라 index번호가 반복됨)
        // ccc안에서 뽑아낼거얌
        for(var index in ccc){
            document.write(ccc[index] + '<br>');
        }
        document.write('<br>');

        // 빈 배열객체를 생성한 후에 요소값들을 추가해도 됨.
        ddd= new Array();
        document.write('요소개수: ' + ddd.length + '<br>');

        ddd[0]=100;
        ddd[1]='apple';
        ddd[2]=5>3; //true
        ddd[3]=new Date();

        for(var n=0; n<ddd.length; n++){
            document.write(ddd[n]+'<br>');
        }
        document.write('<hr>');

        //-------------------------------------

        //파이썬의 딕셔너리처럼 인덱스 번호 대신에 '문자열'키워드로 요소를 구별하는
        //배열이 존재함. 이를[연관배열]이라고 부름

        //연관배열 : '키'로 인덱스를 대신하는 배열
        var eee= new Array();
        eee['name']= 'sam';
        eee['age']= 20;
        eee['address']= 'seoul';

        document.write('이름: ' + eee['name'] + '<br>');
        document.write('나이: ' + eee['age'] + '<br>');
        document.write('주소: ' + eee['adrress'] + '<br>');

        //리터럴 배열로도 연관배열 만들 수 있음.
        fff= [];
        fff['aaa']=1000;
        fff['bbb']=2000;

        document.write(fff+'<br>'); //연관배열은 그대로 출력 안해줌.
        document.write(fff['aaa']+'<br>');
        document.write(fff['bbb']+'<br>');

        document.write('<hr>');

        //2차원 배열 (1차원 배열을 여러개 가진 배열)
        var ggg= new Array(); //빈 배열
        var a1= [10,20,30];
        var a2= ['aa','bb','cc'];
        var a3= [true, false, false, true];

        // 아래는 2차원 배열임
        ggg[0]= a1;
        ggg[1]= a2;
        ggg[2]= a3;

        document.write(ggg[0]+'<br>');
        // 0번째 층의 0호실
        document.write(ggg[0][0] + '<br>');
        document.write(ggg[0][1] + '<br>');
        document.write(ggg[0][2] + '<br>');
        document.write('<br>')

        document.write(ggg[1] + '<br>');
        document.write(ggg[1][0] + '<br>');
        document.write(ggg[1][1] + '<br>');
        document.write(ggg[1][2] + '<br>');
        document.write('<br>');

        document.write(ggg[2] + '<br>');
        for(var n=0; n<ggg[2].length; n++){
            document.write(ggg[2][n]+'<br>');
        }

    </script>



</head>
<body>





    
</body>
</html>
