    <title>kakao map api</title>

    <!-- 모든 지도 API는 실제 서버에 업로드 되어야 만 실행됨. 즉, location이 http~로 시작 -->

    <!-- 카카오지도 API(라이브러리, 모듈) 사용하기 -->
    <!-- 개발하기 전에 반드시 [카카오 개발자 사이트 : developers.kakao.com]의 튜토리얼 문서를 확인 후 제작 -->
    <!-- 경로 : 문서 - 지도 - 시작하기 - 카카오디벨로퍼스 앱 생성 - 맨 위에 앱에서 우클릭 - 새탭생성 - + 앱 생성 - 
     수정은 일반에서 수정 및 삭제 - 도메인 링크 등록 - 카카오맵 활성화 -->
    <!-- 개발가이드에 따라.. 앱 생성 및 api에서 Guide 카테고리 - 실제 지도를 그리는 Javascript API를 불러오기 key 발급 받기. 웹서버 도메인 등록 -->

    <!-- 실제 지도를 불러오는 작업을 수행하는 카카오의 지도 api 라이브러리 적용(외부 스크립트) : 발급받은 자바스크립트 키 를 등로 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5b24224d1607f2892a12651e7820ce59"></script>
    
    <!-- 지도를 띄우는 코드 작성(외부 스크립트) defer: 지연 -->
    <script src="./kakaomap.js" defer></script> <!-- 바디가 만들어진 다음에 해라-->
</head>
